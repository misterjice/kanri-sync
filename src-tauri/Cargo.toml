[package]
name = "kanri"
version = "0.9.0"
description = "Offline kanban board application"
authors = ["trobonox"]
license = "GPL-3.0"
repository = "https://github.com/trobonox/kanri"
default-run = "kanri"
edition = "2021"
rust-version = "1.83"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0.149"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-persisted-scope = { features = ["protocol-asset"], version = "2.3.5" }
ignore = "=0.4.27"
tauri-plugin-store = "2.4.2"
tauri-plugin-log = "2.8.0"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-os = "2.3.2"
tauri-plugin-fs = "2.4.2"
tauri-plugin-opener = "2"
# LAN sync
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
chacha20poly1305 = "0.10"
tiny_http = "0.12"
ureq = { version = "2", default-features = false }
mdns-sd = "0.13"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
tauri = { version = "2.10.3", features = ["protocol-asset", "test"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-window-state = { version = "2.4.1" }

[target."cfg(any(target_os = \"android\", target_os = \"ios\"))".dependencies]
tauri-plugin-barcode-scanner = "2"
